name: Build Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Company logo → app icon
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130 Safari/537.36"
          mkdir -p brand
          curl -fsSL --connect-timeout 15 --max-time 40 --retry 2 -A "$UA" -o brand/emblem.png \
            "https://omaralyassirealestate.com/wp-content/uploads/2026/07/logo-2.png" || true
          pip install --quiet pillow
          python3 scripts/make_icons.py brand/emblem.png

      - name: Signing key
        id: key
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PW" ]; then
            echo "::warning::Signing secrets missing — building a test copy only."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Test build (no signing key yet)
        if: steps.key.outputs.ok != 'true'
        run: |
          gradle --no-daemon assembleDebug
          echo "::error::The app compiles. Add the ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD secrets to publish a release."
          exit 1

      - name: Build APK + AAB
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          KS_FILE: ${{ runner.temp }}/release.jks
          KS_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon assembleRelease bundleRelease

      - name: Collect files
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/AlYassi-Performance-1.0.${{ github.run_number }}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "out/AlYassi-Performance-1.0.${{ github.run_number }}.aab"

      - uses: actions/upload-artifact@v4
        with:
          name: AlYassi-Performance-1.0.${{ github.run_number }}
          path: out/*

      - name: Publish download (Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: نسخة 1.0.${{ github.run_number }}
          make_latest: true
          body: |
            ملف APK للتثبيت المباشر على أندرويد، وملف AAB للرفع على Google Play.
          files: out/*
